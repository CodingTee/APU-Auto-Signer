name: apu_auto_signer
description: "APU batch attendance signing app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  sqflite: ^2.3.3+2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  mobile_scanner: ^5.2.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Launcher icon generation. Run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # Legacy (full) icon. Android 8+ adaptive icons always crop the
  # outer ~17%, which would cut off this icon's border. Use the whole
  # design as a legacy bitmap so it shows completely.
